<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Navy rounded-square background — rx/ry 22.5% mirrors iOS icon rounding -->
  <rect width="512" height="512" rx="115" ry="115" fill="#14213D"/>
  <!-- JS initials: coral, bold, perfectly centred -->
  <text
    x="256"
    y="330"
    font-family="'Manrope','Inter','Helvetica Neue',Arial,sans-serif"
    font-size="264"
    font-weight="800"
    fill="#FF6B5B"
    text-anchor="middle"
    dominant-baseline="auto"
    letter-spacing="-8"
  >JS</text>
</svg>
